services:
    nginx:
        container_name: "${COMPOSE_PROJECT_NAME}-nginx"
        image: nginx:1.31.4-alpine3.24
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "80:80"
        depends_on:
            - laravel

    laravel:
        container_name: "${COMPOSE_PROJECT_NAME}-laravel"
        build:
            context: ./docker/laravel
        volumes:
            - ./:/var/www/html
            - "./docker/laravel/supervisord.dev.conf:/etc/supervisord/supervisord.conf"
            - "./docker/ssh/authorized_keys:/home/www-data/.ssh/authorized_keys:ro,Z"
        networks:
            - default
        ports:
            - "2222:22"
            - "5173:5173"
        expose:
            - "9000"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - postgres

    postgres:
        container_name: "${COMPOSE_PROJECT_NAME}-postgres"
        image: postgres:18.6-alpine3.24
        environment:
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        volumes:
            - ./storage/postgres_data:/var/lib/postgresql/18/docker
        ports:
            - "5432:5432"
        networks:
            - default

    redis:
        container_name: "${COMPOSE_PROJECT_NAME}-redis"
        image: redis:8.10.1-alpine3.23
        volumes:
            - ./storage/redis_data:/data
        networks:
            - default
        ports:
            - "6379:6379"

networks:
    default:
        name: ${COMPOSE_PROJECT_NAME}