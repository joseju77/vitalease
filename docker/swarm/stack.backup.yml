# Backup overlay, always deployed together with stack.yml (swarm.mk adds it through
# backup.mk): `docker stack deploy -c stack.yml -c stack.backup.yml`.
# Scope is deliberately minimal: scheduled pg_dump to a local volume, newest 7 kept.
# No off-site copy, encryption, PITR/WAL archiving or alerting.

services:
    backup:
        image: postgres:18.6-alpine3.24
        # The postgres entrypoint only execs the command when it is not `postgres`.
        command: ["crond", "-f", "-l", "8"]
        networks:
            - internal
        environment:
            PGHOST: postgres
            PGUSER: ${DB_USERNAME:?set DB_USERNAME in docker/swarm/swarm.env}
            PGDATABASE: ${DB_DATABASE:?set DB_DATABASE in docker/swarm/swarm.env}
            PGPASSWORD_FILE: /run/secrets/db_password
            BACKUP_DIR: /backups
            BACKUP_KEEP: "7"
        secrets:
            - db_password
        configs:
            - source: backup_sh
              target: /usr/local/bin/backup.sh
              mode: 0555
            - source: restore_verify_sh
              target: /usr/local/bin/restore-verify.sh
              mode: 0555
            - source: backup_crontab
              target: /etc/crontabs/root
              mode: 0600
        volumes:
            - backups:/backups
        healthcheck:
            test: ["CMD-SHELL", "pgrep -x crond >/dev/null"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        deploy:
            replicas: 1
            restart_policy:
                condition: any
                delay: 5s
                window: 30s
            update_config:
                parallelism: 1
                delay: 10s
                order: stop-first
                failure_action: rollback
                monitor: 20s
            rollback_config:
                parallelism: 1
                order: stop-first
            placement:
                constraints:
                    - node.role == manager
            resources:
                limits:
                    cpus: "0.50"
                    memory: 256M
                reservations:
                    cpus: "0.05"
                    memory: 64M

volumes:
    backups:

# Swarm configs are immutable: the name carries a content hash (BACKUP_CONFIG_REV,
# computed by backup.mk) so editing a script rolls out a new config on deploy.
configs:
    backup_sh:
        name: ${SWARM_STACK:-vitalease}_backup_sh_${BACKUP_CONFIG_REV:-1}
        file: ./backup/backup.sh
    restore_verify_sh:
        name: ${SWARM_STACK:-vitalease}_restore_verify_sh_${BACKUP_CONFIG_REV:-1}
        file: ./backup/restore-verify.sh
    backup_crontab:
        name: ${SWARM_STACK:-vitalease}_backup_crontab_${BACKUP_CONFIG_REV:-1}
        file: ./backup/crontab
