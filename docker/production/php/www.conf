; php-fpm pool. The container runs as www-data already, so no user/group here.
[www]
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Liveness probe used by container healthchecks (cgi-fcgi).
ping.path = /fpm-ping
ping.response = pong

; Keep environment variables set by the entrypoint (secrets mapped from files).
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
