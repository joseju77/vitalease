# Production nginx: static assets baked into the image, PHP proxied to app:9000.

# Docker's embedded DNS; a variable upstream makes nginx start without `app`
# resolvable and re-resolve the service VIP at runtime (502 while it is absent).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # The health endpoint is internal only (listener :8081, never published).
    location = /health {
        return 404;
    }

    location /build/ {
        access_log off;
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        set $upstream app:9000;

        fastcgi_pass $upstream;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # nginx is the edge (port published in host mode, so $remote_addr is the
        # real client). Overwrite instead of append so clients cannot spoof
        # X-Forwarded-For; Laravel trusts only this container's overlay subnet.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;

        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Any other .php file is never executed.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Internal listener, not published by the stack: container healthchecks and health polling.
server {
    listen 8081;
    server_name _;

    access_log off;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /health {
        set $upstream app:9000;

        fastcgi_pass $upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI /health;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
